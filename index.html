<!doctype html>
<html lang="es" class="h-full select-none overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feliz Mesversario - 7 Meses 💕</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@600;700;900&family=Montserrat:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cursive: ["Great Vibes", "cursive"],
              serif: ["Cinzel", "serif"],
              sans: ["Montserrat", "sans-serif"],
            },
            colors: {
              love: {
                400: "#ff758c",
                500: "#ff7eb3",
                600: "#e11d48",
                900: "#2d0b1e",
              },
            },
          },
        },
      };
    </script>

    <style>
      /* Animation & Glow Effects */
      @keyframes pulseGlow {
        0%,
        100% {
          filter: drop-shadow(0 0 20px rgba(255, 117, 140, 0.6))
            drop-shadow(0 0 40px rgba(225, 29, 72, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 35px rgba(255, 126, 179, 0.9))
            drop-shadow(0 0 60px rgba(255, 215, 0, 0.5));
        }
      }

      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-12px) rotate(0.5deg);
        }
      }

      .text-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }

      .card-float {
        animation: floatCard 6s ease-in-out infinite;
      }

      /* 3D Perspective container */
      .tilt-container {
        perspective: 1000px;
      }

      .tilt-card {
        transform-style: preserve-3d;
        transition: transform 0.15s ease-out;
      }

      /* Canvas layered background */
      #bg-canvas,
      #fx-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #bg-canvas {
        z-index: 1;
      }
      #fx-canvas {
        z-index: 10;
      }
    </style>
  </head>
  <body
    class="h-full bg-slate-950 text-white font-sans flex items-center justify-center relative overflow-hidden"
  >
    <!-- Interactive Canvases -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>

    <!-- Music Control (Web Audio API Synthesizer) -->
    <button
      id="audio-toggle"
      class="fixed top-6 right-6 z-50 bg-slate-900/60 backdrop-blur-md border border-pink-500/30 text-pink-300 p-3.5 rounded-full shadow-lg shadow-pink-950/40 hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 group cursor-pointer"
    >
      <i
        id="audio-icon"
        class="fas fa-volume-xmark text-lg group-hover:text-pink-400"
      ></i>
      <span
        id="audio-label"
        class="text-xs font-medium tracking-wide pr-1 hidden sm:inline text-pink-200"
        >Música Ambient</span
      >
    </button>

    <!-- Main Content Container with 3D Tilt Effect -->
    <main
      class="tilt-container relative z-20 px-4 w-full max-w-3xl text-center"
    >
      <div
        id="tilt-card"
        class="tilt-card card-float bg-slate-900/40 backdrop-blur-xl border border-pink-500/20 rounded-3xl p-8 sm:p-14 shadow-2xl shadow-love-900/40 relative overflow-hidden group"
      >
        <!-- Ambient Glow background inside card -->
        <div
          class="absolute -top-24 -left-24 w-60 h-60 bg-love-500/20 rounded-full blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute -bottom-24 -right-24 w-60 h-60 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"
        ></div>

        <!-- Content limited Strictly to "Feliz Mesversario" and "Feliz 7 Meses" -->
        <div class="space-y-6 sm:space-y-8 py-4 pointer-events-none">
          <!-- Main Header: Feliz Mesversario -->
          <h1
            class="font-cursive text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-transparent bg-clip-text bg-gradient-to-r from-pink-200 via-pink-400 to-rose-300 text-glow leading-tight tracking-wide"
          >
            ¡Feliz Mesversario!
          </h1>

          <!-- Decorative Subtle Divider -->
          <div class="flex items-center justify-center gap-4 opacity-70">
            <div
              class="h-[1px] w-12 sm:w-24 bg-gradient-to-r from-transparent to-pink-400"
            ></div>
            <i
              class="fas fa-heart text-pink-400 text-sm sm:text-base animate-pulse"
            ></i>
            <div
              class="h-[1px] w-12 sm:w-24 bg-gradient-to-l from-transparent to-pink-400"
            ></div>
          </div>

          <!-- Secondary Header: Feliz 7 Meses -->
          <h2
            class="font-serif text-3xl sm:text-5xl md:text-6xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-pink-300 to-rose-400 drop-shadow-md"
          >
            ¡FELIZ 7 MESES!
          </h2>
        </div>

        <!-- Interactive Hint -->
        <div
          class="mt-8 text-pink-300/60 text-xs sm:text-sm font-light tracking-wider uppercase flex items-center justify-center gap-2 pointer-events-none"
        >
          <i class="fas fa-hand-pointer animate-bounce text-xs"></i> Toca la
          pantalla
        </div>
      </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
      // --- 1. CANVAS & PARTICLE SYSTEM ---
      const bgCanvas = document.getElementById("bg-canvas");
      const fxCanvas = document.getElementById("fx-canvas");
      const bgCtx = bgCanvas.getContext("2d");
      const fxCtx = fxCanvas.getContext("2d");

      let width = (bgCanvas.width = fxCanvas.width = window.innerWidth);
      let height = (bgCanvas.height = fxCanvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = bgCanvas.width = fxCanvas.width = window.innerWidth;
        height = bgCanvas.height = fxCanvas.height = window.innerHeight;
      });

      // Floating Background Hearts & Stars
      const bgParticles = [];
      const particleCount = 40;

      class BgParticle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = height + Math.random() * 100;
          this.size = Math.random() * 16 + 8;
          this.speedY = Math.random() * 1 + 0.3;
          this.speedX = Math.sin(Math.random() * Math.PI) * 0.5;
          this.opacity = Math.random() * 0.5 + 0.2;
          this.type = Math.random() > 0.4 ? "heart" : "star";
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.02;
        }
        update() {
          this.y -= this.speedY;
          this.x += this.speedX;
          this.rotation += this.rotSpeed;
          if (this.y < -30) this.reset();
        }
        draw() {
          bgCtx.save();
          bgCtx.translate(this.x, this.y);
          bgCtx.rotate(this.rotation);
          bgCtx.globalAlpha = this.opacity;
          bgCtx.fillStyle = "#ff758c";

          if (this.type === "heart") {
            bgCtx.beginPath();
            const topCurveHeight = this.size * 0.3;
            bgCtx.moveTo(0, topCurveHeight);
            bgCtx.bezierCurveTo(
              0,
              0,
              -this.size / 2,
              0,
              -this.size / 2,
              topCurveHeight,
            );
            bgCtx.bezierCurveTo(
              -this.size / 2,
              (this.size + topCurveHeight) / 2,
              0,
              this.size,
              0,
              this.size,
            );
            bgCtx.bezierCurveTo(
              0,
              (this.size + topCurveHeight) / 2,
              this.size / 2,
              (this.size + topCurveHeight) / 2,
              this.size / 2,
              topCurveHeight,
            );
            bgCtx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
            bgCtx.closePath();
            bgCtx.fill();
          } else {
            bgCtx.fillStyle = "#ffd700";
            bgCtx.beginPath();
            bgCtx.arc(0, 0, this.size / 4, 0, Math.PI * 2);
            bgCtx.fill();
          }
          bgCtx.restore();
        }
      }

      for (let i = 0; i < particleCount; i++)
        bgParticles.push(new BgParticle());

      function animateBg() {
        bgCtx.clearRect(0, 0, width, height);
        bgParticles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animateBg);
      }
      animateBg();

      // --- 2. FOREGROUND INTERACTIVE FX (EXPLOSIONS & CURSOR TRAIL) ---
      const fxParticles = [];

      class FxParticle {
        constructor(x, y, isExplosion = false) {
          this.x = x;
          this.y = y;
          this.isExplosion = isExplosion;
          const angle = Math.random() * Math.PI * 2;
          const speed = isExplosion
            ? Math.random() * 8 + 2
            : Math.random() * 2 + 0.5;

          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - (isExplosion ? 1 : 0);
          this.size = isExplosion
            ? Math.random() * 18 + 10
            : Math.random() * 8 + 4;
          this.life = 1;
          this.decay = isExplosion
            ? Math.random() * 0.02 + 0.015
            : Math.random() * 0.04 + 0.03;
          this.color = ["#ff758c", "#ff7eb3", "#f43f5e", "#ffd700", "#ffffff"][
            Math.floor(Math.random() * 5)
          ];
          this.rotation = Math.random() * Math.PI * 2;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.isExplosion) this.vy += 0.1; // gravity
          this.life -= this.decay;
        }
        draw() {
          fxCtx.save();
          fxCtx.translate(this.x, this.y);
          fxCtx.rotate(this.rotation);
          fxCtx.globalAlpha = Math.max(0, this.life);
          fxCtx.fillStyle = this.color;

          // Draw heart shape
          fxCtx.beginPath();
          const s = this.size;
          fxCtx.moveTo(0, 0);
          fxCtx.bezierCurveTo(-s / 2, -s / 2, -s, s / 3, 0, s);
          fxCtx.bezierCurveTo(s, s / 3, s / 2, -s / 2, 0, 0);
          fxCtx.fill();

          fxCtx.restore();
        }
      }

      function animateFx() {
        fxCtx.clearRect(0, 0, width, height);
        for (let i = fxParticles.length - 1; i >= 0; i--) {
          const p = fxParticles[i];
          p.update();
          p.draw();
          if (p.life <= 0) fxParticles.splice(i, 1);
        }
        requestAnimationFrame(animateFx);
      }
      animateFx();

      // Spawn Trail on Mouse Move / Touch Move
      let lastSpawn = 0;
      function handlePointerMove(x, y) {
        const now = Date.now();
        if (now - lastSpawn > 40) {
          // Limit frequency
          fxParticles.push(new FxParticle(x, y, false));
          lastSpawn = now;
        }
      }

      window.addEventListener("mousemove", (e) =>
        handlePointerMove(e.clientX, e.clientY),
      );
      window.addEventListener("touchmove", (e) => {
        if (e.touches[0])
          handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      });

      // Spawn Fireworks Explosion on Click / Tap
      function spawnExplosion(x, y) {
        for (let i = 0; i < 35; i++) {
          fxParticles.push(new FxParticle(x, y, true));
        }
        playChimeSound(); // Play soft acoustic tone on click
      }

      window.addEventListener("click", (e) => {
        // Avoid triggering when clicking music toggle
        if (e.target.closest("#audio-toggle")) return;
        spawnExplosion(e.clientX, e.clientY);
      });

      // Initial burst on load
      setTimeout(() => {
        spawnExplosion(width / 2, height / 2);
      }, 500);

      // --- 3. 3D TILT EFFECT FOR CARD ---
      const tiltCard = document.getElementById("tilt-card");

      window.addEventListener("mousemove", (e) => {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const dx = (e.clientX - cx) / cx;
        const dy = (e.clientY - cy) / cy;

        const tiltX = dy * -12; // Rotate degrees
        const tiltY = dx * 12;

        tiltCard.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      });

      // Device orientation for Mobile 3D tilt
      window.addEventListener("deviceorientation", (e) => {
        if (e.beta && e.gamma) {
          const tiltX = (e.beta - 45) * 0.3;
          const tiltY = e.gamma * 0.3;
          tiltCard.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        }
      });

      // --- 4. SYNTHESIZED ROMANTIC AMBIENT AUDIO (Web Audio API) ---
      let audioCtx = null;
      let isAudioPlaying = false;
      let synthInterval = null;

      const audioToggle = document.getElementById("audio-toggle");
      const audioIcon = document.getElementById("audio-icon");
      const audioLabel = document.getElementById("audio-label");

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      // Play soft romantic melody notes synthetically
      const notes = [261.63, 329.63, 392.0, 523.25, 440.0, 349.23]; // C4, E4, G4, C5, A4, F4
      let noteIdx = 0;

      function playRomanticNote() {
        if (!audioCtx || !isAudioPlaying) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);
        noteIdx = (noteIdx + 1) % notes.length;

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.3);
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + 2.5,
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.6);
      }

      function playChimeSound() {
        if (!audioCtx || audioCtx.state === "suspended") return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(
          587.33 + Math.random() * 200,
          audioCtx.currentTime,
        ); // D5+
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + 0.8,
        );
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }

      audioToggle.addEventListener("click", () => {
        initAudio();
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        isAudioPlaying = !isAudioPlaying;

        if (isAudioPlaying) {
          audioIcon.className =
            "fas fa-volume-high text-lg text-pink-400 animate-pulse";
          audioLabel.innerText = "Música Activa";
          synthInterval = setInterval(playRomanticNote, 1200);
          playRomanticNote();
        } else {
          audioIcon.className = "fas fa-volume-xmark text-lg";
          audioLabel.innerText = "Música Ambient";
          clearInterval(synthInterval);
        }
      });
    </script>
  </body>
</html>
